# Zero-cost end-to-end rehearsal v0.2 (issue #46, ADR-0016): forces the trigger arms. Tier 1: local Ollama only.
# "gemini-2.5-flash" and "gpt-5" are LOCAL Ollama aliases of a small open model
# (configs/rehearsal-ollama.Modelfile); the benchmark accepts only these names.
# Behavioural outcomes of a rehearsal are never analysed: it checks plumbing and measures
# calls/tokens per stage for the budget estimate (issue #47).
name: rehearsal-claude-v02
description: Local rehearsal v0.2, claude_code agent, arms forced to exercise the trigger path.
tier: 1
seed: 20261121
params:
  rehearsal: true
  force_trigger: true  # weak local judge cannot resolve PMIR; outcomes are not analysed
  arms: [D0, D2, D4@P2]
  replicates: [1]
  case_sample:
    channel: indirect_content
    n_cases: 3
  benchmark:
    agent: claude_code
    model: gemini-2.5-flash
    judge_model: gpt-5
    agent_endpoint: http://host.docker.internal:11434/v1
    judge_endpoint: http://localhost:11434/v1
    agent_key_env: MHB_AGENT_API_KEY
    judge_key_env: MHB_JUDGE_API_KEY
    agent_image: memharmbench/claude-code:2.1.228
    gateway_image: memharmbench/gateway:1.101.0
